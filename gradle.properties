org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true
whisperBackend=gpu
whisperWorkerCount=1
whisperThreadsPerWorker=3
useFullFloatDecoderProduction=false
useSplitWhisperProduction=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Ship the verified F32_F16 accumulation patch for the OpenCL accelerator:
# FP16-precision GPU requests execute with FP32 accumulation. Five-sample
# evidence: 0.281% WER (2/712) with the KV decoder versus 2.669% (19/712)
# under native-FP16 accumulation. The patched AAR is generated and
# byte-verified by scripts/prepare-litert-fp16-fp32-accum-gpu-probe.py.
useFp16Fp32AccumGpuProbe=true
